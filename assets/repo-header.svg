<svg width="100%" height="160" viewBox="0 0 1000 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E25A1C"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E25A1C" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="cornerGlow" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Surface -->
  <rect width="1000" height="160" rx="12" fill="url(#bgGrad)"/>
  <rect width="1000" height="160" rx="12" fill="url(#gridPattern)"/>
  <rect width="1000" height="160" rx="12" fill="url(#cornerGlow)"/>
  <rect width="998" height="158" x="1" y="1" rx="11" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Left Accent Blade -->
  <rect x="24" y="28" width="4" height="104" rx="2" fill="url(#textGrad)"/>

  <!-- Repository Title -->
  <text x="44" y="66" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5">
    ⚡ THE PYSPARK HANDBOOK
  </text>

  <!-- Tagline / Value Proposition -->
  <text x="44" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14">
    105 Production Coding Use Cases • Catalyst Optimization • Skew Salting • Memory Triage
  </text>

  <!-- Status Chip (Right-aligned) -->
  <g transform="translate(820, 34)">
    <rect width="144" height="30" rx="15" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
    <circle cx="18" cy="15" r="4" fill="#34d399"/>
    <text x="32" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">
      PRODUCTION
    </text>
  </g>

  <!-- Bottom Metadata Coordinates -->
  <text x="44" y="130" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
    SPARK 3.5+ &amp; 4.0 • DELTA 3.2 • PYARROW UDFS • 157 PRODUCTION TOPICS
  </text>
</svg>