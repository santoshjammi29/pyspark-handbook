name: Handbook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: santoshjammi29/.github/.github/workflows/handbook-ci.yml@v1
    with:
      max_file_kb: 500
      require_manifest: true
      allow_notebooks: false
      check_unused_spark: true
